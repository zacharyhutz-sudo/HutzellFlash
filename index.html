<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HutzellFlash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0e1420;
    font-family: "Courier New", ui-monospace, monospace;
    overflow: hidden;
    touch-action: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap {
    position: relative;
    width: min(100vw, 177.78vh);   /* 16:9 */
    height: min(100vh, 56.25vw);
  }
  canvas {
    width: 100%; height: 100%; display: block;
    image-rendering: pixelated;   /* chunky nearest-neighbor upscale */
  }
  #rotatePrompt {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center; justify-content: center;
    background: #0e1420;
    z-index: 10;
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  #rotatePrompt.show { display: flex; }
  #rotatePrompt .phone {
    width: 52px; height: 92px;
    border: 4px solid #9fd6ff;
    border-radius: 0;
    margin-bottom: 28px;
    animation: turnPhone 1.8s ease-in-out infinite;
  }
  @keyframes turnPhone {
    0%, 25% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(90deg); }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="rotatePrompt">
  <div class="phone"></div>
  <div style="font-size:20px; font-weight:bold; letter-spacing:2px; text-transform:uppercase;">ROTATE YOUR DEVICE</div>
  <div style="font-size:14px; color:#9fd6ff; margin-top:10px;">HutzellFlash flies best in landscape</div>
</div>
<script>
"use strict";

// ---------- Canvas ----------
const canvas = document.getElementById("game");
const VW = 960, VH = 540;                 // internal resolution
const PIXEL = 3;                          // 320x180 true-pixel art grid, upscaled nearest-neighbor
canvas.width = VW; canvas.height = VH;
const main = canvas.getContext("2d");
main.imageSmoothingEnabled = false;
// low-res offscreen buffer: everything is drawn here, then blitted up chunky
const pcan = document.createElement("canvas");
pcan.width = VW / PIXEL; pcan.height = VH / PIXEL;
const ctx = pcan.getContext("2d");
ctx.imageSmoothingEnabled = false;

// ---------- State ----------
const GROUND = VH - 56;
let state = "title";                      // title | play | crash | over
let plane, obstacles, coins, particles, clouds, hazards, ring, popups;
let score, coinCount, speed, t, shakeT, coinFlash, crashTimer, crashFreeze, newBest;
let spawnTimer = 1.2, coinTimer = 0.8, ringTimer = 0;
let best = parseInt(localStorage.getItem("hutzellflash_best") || "0", 10);

// ---------- Progression ----------
const LEVEL_THRESHOLDS = [0, 150, 350, 600, 950, 1400, 2000, 2700, 3600, 4700];
const LEVEL_NAMES = ["SKY TRAINEE", "LOW CLOUD", "MID AIR", "STORM FRONTS", "HURRICANE BAY", "UPPER STRATOS", "JET STREAM", "POLAR FRONT", "STORM EYE", "CROSSWINDS"];
const HAZARD_UNLOCK = 4;                  // level at which wind gusts start
function levelForScore(s) { let n = 1; for (let i = 0; i < LEVEL_THRESHOLDS.length; i++) if (s >= LEVEL_THRESHOLDS[i]) n = i + 1; return n; }
function speedForLevel(lv) { return Math.min(600, 150 + (lv - 1) * 45 + 40 * (1 - Math.exp(-t / 30))); }
function hazardCountForLevel(lv) { return lv < 4 ? 0 : Math.min(3, lv - 3); }

function reset() {
  plane = { x: 150, y: VH / 2, vy: 0, tilt: 0, w: 74, h: 30 };
  obstacles = []; coins = []; hazards = []; particles = []; popups = [];
  clouds = [];
  ring = null;                            // active "clear the ring" objective
  for (let i = 0; i < 5; i++) clouds.push(makeCloud(rnd(-100, VW)));
  score = 0; coinCount = 0; speed = 150; t = 0; shakeT = 0; coinFlash = 0; crashTimer = 0; crashFreeze = 0; newBest = false;
  spawnTimer = 1.2; coinTimer = 0.8; ringTimer = 0;
}

function makeCloud(x) {
  const s = rnd(0.5, 1.4);
  return { x: x, y: rnd(40, GROUND - 120), s: s, v: rnd(8, 26) * s };
}

// ---------- Tiny audio (no assets needed) ----------
let actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) { /* audio is optional */ }
}

// ---------- Helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- Input ----------
const KEY_SPEED = 440;                    // same maximum climb/dive speed as before
const CONTROL_RESPONSE = 10.5;            // quick acceleration without cursor-like snapping
const CONTROL_RELEASE = 8.0;              // settles rapidly when the player releases input
const keys = {};
let pointerY = null, pointerDown = false;
window.addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown"," ","w","s","W","S"].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if ((state === "title" || state === "over") && (e.key === " " || e.key === "Enter")) start();
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

function canvasY(clientY) {
  const r = canvas.getBoundingClientRect();
  return (clientY - r.top) / r.height * VH;
}
canvas.addEventListener("pointerdown", e => {
  pointerDown = true;
  pointerY = canvasY(e.clientY);
  if (state === "title" || state === "over") start();
});
canvas.addEventListener("pointermove", e => {
  if (pointerDown) pointerY = canvasY(e.clientY);
});
window.addEventListener("pointerup", () => { pointerDown = false; });

function start() {
  if (state === "play") return;
  reset();
  state = "play";
  beep(520, 0.12, "triangle");
}

// ---------- Spawning ----------
function spawnObstacle() {
  const kind = Math.floor(rnd(0, 3));
  if (kind === 0) {                        // cloud puff
    const h = rnd(50, 110);
    const low = Math.random() < 0.5;
    obstacles.push({ kind: "cloud", x: VW + 60, y: low ? GROUND - h / 2 : rnd(60, GROUND - 160), w: rnd(80, 130), h: h });
  } else if (kind === 1) {                 // balloon
    obstacles.push({ kind: "balloon", x: VW + 40, y: rnd(90, GROUND - 90), w: 34, h: 46, bob: rnd(0, 6.28), str: rnd(20, 54) });
  } else {                                 // bird
    const vy0 = rnd(-40, 40);
    obstacles.push({ kind: "bird", x: VW + 40, y: rnd(100, GROUND - 110), w: 46, h: 26, vy: vy0, flap: 0 });
  }
}

function spawnCoin() {
  const cluster = Math.random() < 0.4 ? 3 : 1;
  const y = rnd(90, GROUND - 80);
  for (let i = 0; i < cluster; i++) {
    coins.push({ x: VW + 40 + i * 44, y: y + (cluster > 1 ? i * 4 : 0), r: 13, spin: rnd(0, 6.28) });
  }
}

// objective ring: a golden ring the plane must thread through
function spawnRing() {
  ring = { x: VW + 120, y: rnd(130, GROUND - 140), r: 64, spin: 0 };
}

// wind gust hazard: pushes the plane off course
function spawnHazard() {
  const fromLeft = Math.random() < 0.5;
  hazards.push({
    x: fromLeft ? -60 : VW + 60,
    y: rnd(80, GROUND - 90),
    w: 120, h: 90,
    dir: fromLeft ? 1 : -1,
    push: Math.random() < 0.5 ? -1 : 1,   // -1 = blows up, +1 = blows down
    spin: rnd(0, 6.28)
  });
}

function burst(x, y, color, n, energy = 1) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), sp = rnd(60, 260) * energy;
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.7), t: 0, color: color, r: rnd(2, 5) });
  }
}

function popup(text, x, y, color, life = 0.62) {
  popups.push({ text, x, y, color, life, t: 0 });
}

// ---------- Update ----------
function update(dt) {
  t += dt;

  // A crash gets a tiny hit-stop before debris moves. It makes impact feel crisp
  // without changing the collision rules or run difficulty.
  if (state === "crash" && crashFreeze > 0) {
    crashFreeze = Math.max(0, crashFreeze - dt);
    return;
  }

  // clouds always drift
  for (const c of clouds) {
    c.x -= c.v * dt * (state === "play" ? 1.6 : 1);
    if (c.x < -160) Object.assign(c, makeCloud(VW + rnd(40, 200)));
  }

  // particles and score popups continue through the short crash animation
  for (const p of particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; }
  particles = particles.filter(p => p.t < p.life);
  for (const p of popups) { p.t += dt; p.y -= 28 * dt; }
  popups = popups.filter(p => p.t < p.life);

  shakeT = Math.max(0, shakeT - dt * (state === "crash" ? 4.5 : 3));
  coinFlash = Math.max(0, coinFlash - dt * 4);

  if (state === "crash") {
    crashTimer -= dt;
    if (crashTimer <= 0) state = "over";
    return;
  }
  if (state !== "play") return;

  // level from score; speed ramps with level
  const lv = levelForScore(score);
  speed = speedForLevel(lv);
  score += speed * dt * 0.05;

  // Flight polish: input still means only UP / DOWN, but the plane now eases into
  // its target vertical speed instead of teleporting directly at KEY_SPEED.
  const thrust = (keys["arrowup"] || keys["w"] ? -1 : 0) + (keys["arrowdown"] || keys["s"] ? 1 : 0);
  let targetVy = thrust * KEY_SPEED;
  let response = thrust ? CONTROL_RESPONSE : CONTROL_RELEASE;
  if (pointerDown && pointerY != null) {
    const delta = pointerY - plane.y;
    targetVy = Math.max(-KEY_SPEED, Math.min(KEY_SPEED, delta * 7.5));
    response = CONTROL_RESPONSE + 2;
  }
  plane.vy += (targetVy - plane.vy) * Math.min(1, dt * response);
  plane.y += plane.vy * dt;

  const minY = 50, maxY = GROUND - 16;
  if (plane.y <= minY) { plane.y = minY; if (plane.vy < 0) plane.vy *= 0.22; }
  if (plane.y >= maxY) { plane.y = maxY; if (plane.vy > 0) plane.vy *= 0.22; }

  // Banking follows actual motion, so both keyboard and touch share the same feel.
  const targetTilt = Math.max(-0.62, Math.min(0.62, plane.vy / KEY_SPEED * 0.62));
  plane.tilt += (targetTilt - plane.tilt) * Math.min(1, dt * 11);

  // spawn timers
  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnObstacle(); spawnTimer = rnd(0.85, 1.5) * Math.max(0.55, 1 - t / 90); }
  coinTimer -= dt;
  if (coinTimer <= 0) { spawnCoin(); coinTimer = rnd(1.4, 2.6); }
  // periodic objective ring (every ~9-14s of play)
  ringTimer -= dt;
  if (ringTimer <= 0) { spawnRing(); ringTimer = rnd(9, 14); }

  // move hazards (wind gusts)
  for (const h of hazards) { h.x += h.dir * speed * 0.6 * dt; h.spin += dt * 6; }
  hazards = hazards.filter(h => h.x > -200 && h.x < VW + 200);
  // keep the right number of hazards for the current level
  const wantHaz = hazardCountForLevel(lv);
  if (hazards.length < wantHaz && Math.random() < dt * 0.6) spawnHazard();

  // move ring
  if (ring) { ring.x -= speed * dt; ring.spin += dt * 3; if (ring.x < -160) ring = null; }

  // move obstacles
  for (const o of obstacles) {
    o.x -= speed * dt;
    if (o.kind === "balloon") { o.bob += dt * 3; o.y += Math.sin(o.bob) * 26 * dt; }
    if (o.kind === "bird") {
      o.flap += dt * 14;
      o.y += o.vy * dt + Math.sin(t * 2 + o.x * 0.01) * 18 * dt;
      o.y = Math.max(70, Math.min(GROUND - 60, o.y));
    }
  }
  obstacles = obstacles.filter(o => o.x > -160);
  for (const c of coins) { c.x -= speed * dt; c.spin += dt * 6; }
  coins = coins.filter(c => c.x > -40);

  // wind gust push (grows stronger with level)
  const gust = 70 + lv * 14;
  for (const h of hazards) {
    const hw = h.w * 0.5, hh = h.h * 0.55;
    if (Math.abs(h.x - plane.x) < hw + plane.w * 0.3 && Math.abs(h.y - plane.y) < hh + plane.h * 0.4) {
      plane.y += h.push * gust * dt;             // blows up or down off course
      plane.tilt += h.dir * 0.35;
    }
  }
  plane.y = Math.max(50, Math.min(GROUND - 16, plane.y));

  // ring objective check
  if (ring) {
    const dx = ring.x - plane.x, dy = ring.y - plane.y;
    if (dx * dx + dy * dy < ring.r * ring.r) {
      score += 150; coinFlash = 1; shakeT = Math.max(shakeT, 0.13);
      burst(ring.x, ring.y, "#ffd94d", 20, 1.05);
      burst(ring.x, ring.y, "#fff3a4", 8, 0.72);
      popup("+150", ring.x, ring.y - 44, "#fff0a7", 0.78);
      beep(1040, 0.10, "square", 0.075);
      beep(1560, 0.18, "sine", 0.055);
      ring = null;
    }
  }

  // collisions (plane is a forgiving box)
  const px = plane.x, py = plane.y, pw = plane.w * 0.36, ph = plane.h * 0.42;
  for (const o of obstacles) {
    const ow = o.kind === "bird" ? o.w * 0.55 : o.w * 0.42;
    const oh = o.kind === "cloud" ? o.h * 0.45 : o.h * 0.5;
    if (Math.abs(o.x - px) < (ow + pw) && Math.abs(o.y - py) < (oh + ph)) {
      gameOver(o);
      return;
    }
  }
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    const dx = c.x - px, dy = c.y - py;
    if (dx * dx + dy * dy < 42 * 42) {
      coins.splice(i, 1);
      coinCount++;
      score += 25;
      coinFlash = 1; shakeT = Math.max(shakeT, 0.035);
      burst(c.x, c.y, "#ffd94d", 10, 0.78);
      burst(c.x, c.y, "#fff3a4", 4, 0.5);
      popup("+25", c.x, c.y - 24, "#fff0a7", 0.52);
      beep(920, 0.07, "square", 0.06);
      beep(1380, 0.11, "sine", 0.045);
    }
  }

  // ground scrape
  if (plane.y > GROUND - 16) { gameOver(null); }

}

function gameOver(hit) {
  if (state !== "play") return;
  state = "crash";
  crashFreeze = 0.085;
  crashTimer = 0.42;
  shakeT = 1;
  burst(plane.x, plane.y, "#e8edf4", 30, 1.05);
  burst(plane.x, plane.y, "#ff7b4d", 20, 1.0);
  burst(plane.x, plane.y, "#ffd36a", 10, 0.7);
  if (hit) burst(hit.x, hit.y, hit.kind === "cloud" ? "#ffffff" : "#ffb04d", 14, 0.8);
  beep(220, 0.18, "sawtooth", 0.09);
  beep(110, 0.34, "triangle", 0.11);
  const total = Math.floor(score);
  newBest = total > best;
  if (newBest) { best = total; localStorage.setItem("hutzellflash_best", String(best)); }
}

// ---------- Rendering ----------
// All drawing is handled by graphics.js. Gameplay above remains unchanged.
</script>
<script src="graphics.js"></script>
<script>
"use strict";

// ---------- Mobile orientation prompt ----------
const rotatePrompt = document.getElementById("rotatePrompt");
const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
function isPortrait() { return window.innerHeight > window.innerWidth; }
function checkOrientation() {
  rotatePrompt.classList.toggle("show", isTouch && isPortrait());
}
window.addEventListener("resize", checkOrientation);
window.addEventListener("orientationchange", checkOrientation);
checkOrientation();

// ---------- Main loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
